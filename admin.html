<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candyaura Admin Orders</title><style>body{font-family:system-ui,sans-serif;background:#fff8f1;margin:0;color:#2b211c}.wrap{max-width:1000px;margin:auto;padding:24px}h1{margin-bottom:8px}.login,.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}input,button,select{padding:12px;border:1px solid #ddd;border-radius:10px}button{cursor:pointer;background:#2b211c;color:white}.card{background:white;border:1px solid #eee;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #00000008}.muted{color:#777}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.items{margin:8px 0;padding-left:18px}</style></head><body><main class="wrap"><h1>🍬 Candyaura Orders</h1><p class="muted">Private admin dashboard</p><div class="login"><input id="password" type="password" placeholder="Admin password"><button onclick="login()">Login</button></div><div id="app" hidden><div class="toolbar"><button onclick="loadOrders()">Refresh orders</button></div><div id="orders"></div></div></main><script>let auth='';function login(){const p=document.getElementById('password').value;if(!p)return;auth='Basic '+btoa('admin:'+p);document.getElementById('app').hidden=false;loadOrders()}async function loadOrders(){const r=await fetch('/api/admin/orders',{headers:{Authorization:auth}});const d=await r.json();if(!r.ok){alert(d.error||'Login failed');return}const box=document.getElementById('orders');box.innerHTML=d.orders.length?d.orders.map(o=>`<article class="card"><div class="row"><strong>Order ${o.id.slice(0,8)}</strong><span>${new Date(o.receivedAt).toLocaleString()}</span></div><p><b>${esc(o.name)}</b> · ${esc(o.phone)}<br>${esc(o.address)}</p><ul class="items">${o.items.map(i=>`<li>${esc(i.name||i.title||'Product')} × ${Number(i.quantity||1)}${i.price!=null?' — Rs '+i.price:''}</li>`).join('')}</ul><div class="row"><strong>Total: Rs ${Number(o.total||0)}</strong><select onchange="setStatus('${o.id}',this.value)"><option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option><option value="Confirmed" ${o.status==='Confirmed'?'selected':''}>Confirmed</option><option value="Delivered" ${o.status==='Delivered'?'selected':''}>Delivered</option><option value="Cancelled" ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select></div></article>`).join(''):'<p class="muted">No orders yet.</p>'}async function setStatus(id,status){const r=await fetch('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',headers:{Authorization:auth,'content-type':'application/json'},body:JSON.stringify({status})});if(!r.ok){const d=await r.json();alert(d.error||'Could not update order')}}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script></body></html>
