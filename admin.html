<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candyaura Admin Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f1eb;color:#251c17}.top{background:#251c17;color:#fff;padding:20px}.topin,.wrap{max-width:1100px;margin:auto}.topin{display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:800}.wrap{padding:20px}.login{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:20px;box-shadow:0 10px 30px #0001}.login input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:10px 0}.btn{border:0;border-radius:10px;padding:11px 15px;background:#251c17;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.order{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 24px #0000000b}.label{font-size:13px;color:#777}.num{font-size:28px;font-weight:800;margin-top:5px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.tools input,.tools select{padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff}.orders{display:grid;gap:12px}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:99px;background:#eee5dc;font-size:12px;font-weight:800}.items{background:#faf8f5;border-radius:12px;padding:12px;margin:12px 0}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.empty{text-align:center;padding:40px;color:#777}.error{color:#b42318;margin-top:10px;font-weight:700}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}</style></head><body><header class="top"><div class="topin"><div class="brand">🍬 Candyaura Admin</div><button class="btn" onclick="logout()" style="background:#fff;color:#251c17">Logout</button></div></header><main class="wrap"><section id="login" class="login"><h2>Admin Login</h2><p style="color:#777">Private order dashboard</p><input id="password" type="password" placeholder="Admin password"><button id="loginBtn" class="btn" onclick="login()" style="width:100%">Login</button><div id="loginError" class="error"></div></section><section id="app" hidden><div class="stats"><div class="stat"><div class="label">Total Orders</div><div class="num" id="total">0</div></div><div class="stat"><div class="label">Pending</div><div class="num" id="pending">0</div></div><div class="stat"><div class="label">Confirmed</div><div class="num" id="confirmed">0</div></div><div class="stat"><div class="label">Revenue</div><div class="num" id="revenue">Rs 0</div></div></div><div class="tools"><input id="search" placeholder="Search orders..." oninput="render()"><select id="filter" onchange="render()"><option>All</option><option>Pending</option><option>Confirmed</option><option>Delivered</option><option>Cancelled</option></select><button class="btn" onclick="loadOrders()">↻ Refresh</button></div><div id="orders" class="orders"></div></section></main><script>let auth='',orders=[];async function login(){const p=document.getElementById('password').value;const err=document.getElementById('loginError');const btn=document.getElementById('loginBtn');err.textContent='';if(!p){err.textContent='Enter your password.';return}auth='Basic '+btoa('admin:'+p);btn.disabled=true;btn.textContent='Checking...';try{const r=await fetch('/api/admin/orders',{headers:{Authorization:auth}});const d=await r.json();if(!r.ok)throw Error(d.error||'Unauthorized');orders=d.orders||[];document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;render()}catch(e){auth='';err.textContent=e.message==='Unauthorized'?'Incorrect password.':'Login failed: '+e.message}finally{btn.disabled=false;btn.textContent='Login'}}function logout(){auth='';orders=[];location.reload()}async function loadOrders(){try{const r=await fetch('/api/admin/orders',{headers:{Authorization:auth}}),d=await r.json();if(r.status===401){logout();return}if(!r.ok)throw Error(d.error||'Could not load orders');orders=d.orders||[];render()}catch(e){document.getElementById('orders').innerHTML='<div class="order empty">'+esc(e.message)+'</div>'}}function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;let x=orders.filter(o=>(f==='All'||(o.status||'Pending')===f)&&JSON.stringify(o).toLowerCase().includes(q));document.getElementById('total').textContent=orders.length;document.getElementById('pending').textContent=orders.filter(o=>(o.status||'Pending')==='Pending').length;document.getElementById('confirmed').textContent=orders.filter(o=>o.status==='Confirmed').length;document.getElementById('revenue').textContent='Rs '+orders.reduce((s,o)=>s+Number(o.total||0),0).toLocaleString();document.getElementById('orders').innerHTML=x.length?x.map(o=>'<article class="order"><div class="orderhead"><strong>Order '+esc((o.id||'').slice(0,8))+'</strong><span class="badge">'+esc(o.status||'Pending')+'</span></div><p><b>'+esc(o.name)+'</b> · '+esc(o.phone)+'<br>📍 '+esc(o.address)+'</p><div class="items">'+(o.items||[]).map(i=>esc(i.name||i.title||'Product')+' × '+Number(i.quantity||1)+(i.price!=null?' — Rs '+Number(i.price):'')).join('<br>')+'</div><div class="actions"><strong>Total: Rs '+Number(o.total||0).toLocaleString()+'</strong><select onchange="setStatus(\''+esc(o.id)+'\',this.value)"><option>Pending</option><option>Confirmed</option><option>Delivered</option><option>Cancelled</option></select></div></article>').join(''):'<div class="order empty">No orders found.</div>'}async function setStatus(id,status){const r=await fetch('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',headers:{Authorization:auth,'content-type':'application/json'},body:JSON.stringify({status})});if(!r.ok){const d=await r.json();alert(d.error||'Could not update order')}await loadOrders()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
