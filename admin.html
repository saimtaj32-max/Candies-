<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candyaura Admin</title><style>body{font-family:Arial,sans-serif;background:#faf7f2;margin:0;padding:20px;color:#222}h1{margin:0 0 6px}.muted{color:#777;margin-bottom:20px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #00000012}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}.pill{padding:5px 9px;border-radius:999px;background:#f0e7dc;font-size:12px}.items{white-space:pre-wrap;color:#555}button{border:0;border-radius:10px;padding:9px 13px;cursor:pointer;background:#222;color:#fff}.empty{padding:30px;text-align:center;color:#777}</style></head><body><h1>🍬 Candyaura Admin</h1><div class="muted">Orders received from your website</div><button onclick="load()">Refresh Orders</button><div id="orders"><div class="empty">Loading...</div></div><script>async function load(){const box=document.getElementById('orders');box.innerHTML='<div class="empty">Loading...</div>';try{const r=await fetch('/api/orders');if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!data.orders?.length){box.innerHTML='<div class="empty">No orders yet 📦</div>';return}box.innerHTML=data.orders.map(o=>`<div class="card"><div class="row"><strong>Order #${o.id}</strong><span class="pill">${esc(o.status||'new')}</span></div><p><b>Customer:</b> ${esc(o.customer_name)}<br><b>Phone:</b> ${esc(o.phone)}<br><b>Address:</b> ${esc(o.address)}</p><p><b>Distance:</b> ${o.distance_km} km<br><b>Subtotal:</b> Rs ${o.subtotal}<br><b>Delivery:</b> Rs ${o.delivery_charge}<br><b>Total:</b> <strong>Rs ${o.total}</strong></p><div class="items"><b>Items:</b> ${esc(o.items)}</div><small>${esc(o.created_at||'')}</small></div>`).join('')}catch(e){box.innerHTML='<div class="empty">Could not load orders. '+esc(e.message)+'</div>'}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
