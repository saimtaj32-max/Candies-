<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candyaura Cart</title><style>
:root{--ink:#160d18;--pink:#ff4f9a;--cream:#fff9f3;--line:#eadfe6;--muted:#786d76}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}.wrap{max-width:900px;margin:auto;padding:24px 16px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.logo{font-family:Georgia,serif;font-size:30px;font-weight:800}.logo span{color:var(--pink)}.back{padding:11px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 45px rgba(40,10,30,.07)}h1{font-family:Georgia,serif;font-size:44px;margin:8px 0 25px}.row{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:800}.price{color:var(--muted);font-size:14px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:50%;cursor:pointer;font-weight:800}.remove{border:0;background:none;color:#c44;cursor:pointer}.summary{margin-top:24px;padding-top:20px;border-top:2px solid var(--line)}.sumline{display:flex;justify-content:space-between;margin:9px 0}.total{font-size:24px;font-weight:900}.checkout{width:100%;margin-top:18px;border:0;border-radius:999px;padding:15px;background:var(--pink);color:#fff;font-weight:900;cursor:pointer;font-size:16px}.empty{text-align:center;color:var(--muted);padding:40px 10px}.note{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}@media(max-width:600px){h1{font-size:36px}.row{grid-template-columns:1fr auto}.price{grid-column:1}.qty{grid-column:2;grid-row:1}.remove{grid-column:2;grid-row:2}.top{gap:10px}}
</style></head><body><div class="wrap"><div class="top"><div class="logo">Candy<span>aura</span> 🍭</div><a class="back" href="index.html">← Continue shopping</a></div><div class="card"><h1>Your Sweet Cart 🛒</h1><div id="cart"></div><div id="summary" class="summary"></div></div><div class="note">Your cart is saved on this device. Checkout opens WhatsApp with your order summary.</div></div><script>
const phone='923703022377';
const products=[['Stone Candy',250],['Gummy Bears',300],['Rainbow Lollipop',200],['Premium Chocolate',450],['Strawberry Candy',250],['Mint Candy',220],['Mixed Candy Box',550],['Candyaura Gift Box',999]];
let cart=JSON.parse(localStorage.getItem('candyauraCart')||'{}');
function save(){localStorage.setItem('candyauraCart',JSON.stringify(cart));render()}
function add(name){cart[name]=(cart[name]||0)+1;save()}
function change(name,d){cart[name]=(cart[name]||0)+d;if(cart[name]<=0)delete cart[name];save()}
function removeItem(name){delete cart[name];save()}
function render(){const el=document.getElementById('cart');const keys=Object.keys(cart);if(!keys.length){el.innerHTML='<div class="empty">🍬<br><br>Your cart is empty.<br>Add some sweetness from the shop!</div>';document.getElementById('summary').innerHTML='';return}let total=0;el.innerHTML=keys.map(name=>{const p=products.find(x=>x[0]===name);const q=cart[name];const sub=p[1]*q;total+=sub;return `<div class="row"><div><div class="name">${name}</div><div class="price">Rs. ${p[1]} each</div></div><div class="qty"><button onclick="change('${name}',-1)">−</button><b>${q}</b><button onclick="change('${name}',1)">+</button></div><b>Rs. ${sub}</b><button class="remove" onclick="removeItem('${name}')">Remove</button></div>`}).join('');document.getElementById('summary').innerHTML=`<div class="sumline"><span>Items</span><b>${keys.reduce((s,k)=>s+cart[k],0)}</b></div><div class="sumline total"><span>Total</span><span>Rs. ${total}</span></div><button class="checkout" onclick="checkout()">Checkout on WhatsApp 💬</button>`}
function checkout(){let lines=['Assalamualaikum Candyaura! 🍭','I want to place this order:',''];let total=0;Object.keys(cart).forEach(name=>{const p=products.find(x=>x[0]===name),q=cart[name];total+=p[1]*q;lines.push(`${name} × ${q} = Rs. ${p[1]*q}`)});lines.push('',`Total: Rs. ${total}`,'','Please share delivery details.');window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(lines.join('\n')),'_blank')}
render();
</script></body></html>
