<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f34f98"><title>Candyaura | Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#f34f98;--pink-dark:#d9367d;--ink:#211c25;--muted:#756d78;--cream:#fff9fc;--line:#f1e4ec;--shadow:0 18px 50px rgba(67,32,61,.10)}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{width:min(1000px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:28px}.logo{font-family:'Playfair Display',serif;font-size:30px;font-weight:700}.logo b{color:var(--pink)}.back{padding:11px 17px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:var(--shadow)}h1{font-family:'Playfair Display',serif;font-size:clamp(38px,6vw,52px);margin:4px 0 8px}.intro{color:var(--muted);margin-bottom:26px}.row{display:grid;grid-template-columns:1fr auto auto auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:800}.price{color:var(--muted);font-size:13px}.qty{display:flex;align-items:center;gap:9px}.qty button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:50%;cursor:pointer;font-weight:800}.subtotal{font-weight:800}.remove{border:0;background:none;color:#c44;cursor:pointer;font-weight:700}.summary{margin-top:24px;padding-top:20px;border-top:2px solid var(--line)}.sumline{display:flex;justify-content:space-between;margin:9px 0;color:var(--muted)}.total{font-size:25px;font-weight:900;color:var(--ink);margin-top:15px}.checkout{width:100%;margin-top:18px;border:0;border-radius:999px;padding:16px;background:var(--pink);color:#fff;font-weight:900;cursor:pointer;font-size:16px}.checkout:hover{background:var(--pink-dark)}.clear{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:999px;padding:13px;background:#fff;font-weight:700;cursor:pointer}.form{display:none;margin-top:28px;padding-top:24px;border-top:2px solid var(--line)}.form.open{display:block}.form h2{font-family:'Playfair Display',serif;font-size:30px;margin:0 0 8px}.form p{color:var(--muted);font-size:14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.field{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;background:#fff}.field:focus{border-color:#ef9fc2;box-shadow:0 0 0 4px rgba(243,79,152,.08)}textarea.field{min-height:105px;resize:vertical}.full{grid-column:1/-1}.status{margin-top:14px;padding:12px 14px;border-radius:14px;background:#fff7fb;color:var(--pink-dark);font-weight:700;display:none}.empty{text-align:center;color:var(--muted);padding:55px 10px}.empty-icon{font-size:55px}.note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}@media(max-width:650px){.top{align-items:flex-start}.row{grid-template-columns:1fr auto}.qty{grid-column:2;grid-row:1}.subtotal{grid-column:1}.remove{grid-column:2;grid-row:2}.card{padding:20px}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><div class="wrap"><div class="top"><div class="logo">Candy<b>aura</b> ✦</div><a class="back" href="index.html">← Continue shopping</a></div>
<div class="card"><h1>Your Sweet Cart 🛒</h1><p class="intro">Review your treats, adjust quantities and place your order directly on the website.</p><div id="cart"></div><div id="summary" class="summary"></div>
<div id="orderForm" class="form"><h2>Delivery details 📦</h2><p>Enter your details and tap Place Order. Your order will be saved securely for Candyaura.</p><form onsubmit="placeOrder(event)"><div class="fields"><input class="field" id="name" required placeholder="Full name"><input class="field" id="phone" required type="tel" placeholder="Phone number"><textarea class="field full" id="address" required placeholder="Complete delivery address"></textarea><textarea class="field full" id="notes" placeholder="Order notes (optional)"></textarea></div><button class="checkout" type="submit" id="placeBtn">Place Order ✅</button><div class="status" id="status"></div></form></div></div><div class="note">Your cart is saved on this device.</div></div>
<script>
const products={'Strawberry Candy':250,'Choco Bites':450,'Gummy Bears':300,'Rainbow Lollies':200};
let cart=JSON.parse(localStorage.getItem('candyauraCart')||'{}');
function save(){localStorage.setItem('candyauraCart',JSON.stringify(cart));render()}
function change(name,d){cart[name]=(cart[name]||0)+d;if(cart[name]<=0)delete cart[name];save()}
function removeItem(name){delete cart[name];save()}
function clearCart(){cart={};save()}
function render(){const el=document.getElementById('cart'),summary=document.getElementById('summary'),keys=Object.keys(cart),form=document.getElementById('orderForm');if(!keys.length){el.innerHTML='<div class="empty"><div class="empty-icon">🍬</div><b>Your cart is empty.</b><br>Add some sweetness from the shop!</div>';summary.innerHTML='';form.classList.remove('open');return}let total=0,count=0;el.innerHTML=keys.map(name=>{const price=products[name]||0,q=cart[name],sub=price*q;total+=sub;count+=q;return `<div class="row"><div><div class="name">${name}</div><div class="price">Rs. ${price} each</div></div><div class="qty"><button onclick="change('${name}',-1)">−</button><b>${q}</b><button onclick="change('${name}',1)">+</button></div><div class="subtotal">Rs. ${sub}</div><button class="remove" onclick="removeItem('${name}')">Remove</button></div>`}).join('');summary.innerHTML=`<div class="sumline"><span>Items</span><b>${count}</b></div><div class="sumline total"><span>Total</span><span>Rs. ${total}</span></div><button class="checkout" onclick="showForm()">Continue to checkout →</button><button class="clear" onclick="clearCart()">Clear cart</button>`}
function showForm(){document.getElementById('orderForm').classList.add('open');document.getElementById('orderForm').scrollIntoView({behavior:'smooth',block:'start'})}
async function placeOrder(e){e.preventDefault();const keys=Object.keys(cart);if(!keys.length)return;const items=keys.map(name=>({name,quantity:cart[name],price:products[name]||0,subtotal:(products[name]||0)*cart[name]}));const total=items.reduce((s,i)=>s+i.subtotal,0);const payload={name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),address:document.getElementById('address').value.trim(),notes:document.getElementById('notes').value.trim(),items,total};const btn=document.getElementById('placeBtn'),status=document.getElementById('status');btn.disabled=true;btn.textContent='Placing order…';status.style.display='block';status.textContent='Submitting your order…';try{const r=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'Order could not be placed');localStorage.removeItem('candyauraCart');cart={};document.getElementById('cart').innerHTML='<div class="empty"><div class="empty-icon">🎉</div><b>Order received!</b><br>Thank you for ordering from Candyaura.</div>';document.getElementById('summary').innerHTML='';document.getElementById('orderForm').classList.remove('open');status.textContent='Order placed successfully. Order ID: '+data.orderId}catch(err){status.textContent=err.message+' Please try again.';btn.disabled=false;btn.textContent='Place Order ✅'}}
render();
</script></body></html>
