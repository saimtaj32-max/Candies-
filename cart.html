<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f34f98">
<title>Candyaura | Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#f34f98;--pink-dark:#d9367d;--ink:#211c25;--muted:#756d78;--cream:#fff9fc;--line:#f1e4ec;--shadow:0 18px 50px rgba(67,32,61,.10)}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{width:min(1000px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:28px}.logo{font-family:'Playfair Display',serif;font-size:30px;font-weight:700}.logo b{color:var(--pink)}.back{padding:11px 17px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700}.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:var(--shadow)}h1{font-family:'Playfair Display',serif;font-size:clamp(38px,6vw,52px);margin:4px 0 8px}.intro{color:var(--muted);margin-bottom:26px}.row{display:grid;grid-template-columns:1fr auto auto auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:800;font-size:16px}.price{color:var(--muted);font-size:13px;margin-top:3px}.qty{display:flex;align-items:center;gap:9px}.qty button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:50%;cursor:pointer;font-weight:800}.qty button:hover{border-color:var(--pink);color:var(--pink)}.subtotal{font-weight:800}.remove{border:0;background:none;color:#c44;cursor:pointer;font-size:12px;font-weight:700}.summary{margin-top:24px;padding-top:20px;border-top:2px solid var(--line)}.sumline{display:flex;justify-content:space-between;margin:9px 0;color:var(--muted)}.total{font-size:25px;font-weight:900;color:var(--ink);margin-top:15px}.checkout{width:100%;margin-top:18px;border:0;border-radius:999px;padding:16px;background:var(--pink);color:#fff;font-weight:900;cursor:pointer;font-size:16px}.checkout:hover{background:var(--pink-dark)}.clear{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:999px;padding:13px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:55px 10px}.empty-icon{font-size:55px;margin-bottom:10px}.note{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}@media(max-width:650px){.top{align-items:flex-start}.row{grid-template-columns:1fr auto}.qty{grid-column:2;grid-row:1}.subtotal{grid-column:1}.remove{grid-column:2;grid-row:2}.card{padding:20px}.back{font-size:12px;padding:9px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">Candy<b>aura</b> ✦</div><a class="back" href="index.html">← Continue shopping</a></div>
  <div class="card"><h1>Your Sweet Cart 🛒</h1><p class="intro">Review your treats, adjust quantities and send your order directly to Candyaura on WhatsApp.</p><div id="cart"></div><div id="summary" class="summary"></div></div>
  <div class="note">Your cart is saved on this device, so it stays available when you return.</div>
</div>
<script>
const phone='923703022377';
const products={
 'Strawberry Candy':250,
 'Choco Bites':450,
 'Gummy Bears':300,
 'Rainbow Lollies':200
};
let cart=JSON.parse(localStorage.getItem('candyauraCart')||'{}');
function save(){localStorage.setItem('candyauraCart',JSON.stringify(cart));render()}
function change(name,d){cart[name]=(cart[name]||0)+d;if(cart[name]<=0)delete cart[name];save()}
function removeItem(name){delete cart[name];save()}
function clearCart(){cart={};save()}
function render(){
 const el=document.getElementById('cart'),summary=document.getElementById('summary'),keys=Object.keys(cart);
 if(!keys.length){el.innerHTML='<div class="empty"><div class="empty-icon">🍬</div><b>Your cart is empty.</b><br>Add some sweetness from the shop!</div>';summary.innerHTML='';return}
 let total=0,count=0;
 el.innerHTML=keys.map(name=>{const price=products[name]||0,q=cart[name],sub=price*q;total+=sub;count+=q;return `<div class="row"><div><div class="name">${name}</div><div class="price">Rs. ${price} each</div></div><div class="qty"><button onclick="change('${name}',-1)">−</button><b>${q}</b><button onclick="change('${name}',1)">+</button></div><div class="subtotal">Rs. ${sub}</div><button class="remove" onclick="removeItem('${name}')">Remove</button></div>`}).join('');
 summary.innerHTML=`<div class="sumline"><span>Items</span><b>${count}</b></div><div class="sumline total"><span>Total</span><span>Rs. ${total}</span></div><button class="checkout" onclick="checkout()">Checkout on WhatsApp 💬</button><button class="clear" onclick="clearCart()">Clear cart</button>`;
}
function checkout(){
 let lines=['Assalamualaikum Candyaura! 🍭','I want to place this order:',''];let total=0;
 Object.keys(cart).forEach(name=>{const price=products[name]||0,q=cart[name];total+=price*q;lines.push(`${name} × ${q} = Rs. ${price*q}`)});
 lines.push('',`Total: Rs. ${total}`,'','Please share my name, phone number and delivery address.');
 window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(lines.join('\n')),'_blank');
}
render();
</script>
</body>
</html>
