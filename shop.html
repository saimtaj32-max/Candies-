<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CandyAura — The Collection</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#170b12;--rose:#d75b8d;--gold:#c7a25b;--cream:#fffaf5;--muted:#776a71;--line:#eadfe4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}a{text-decoration:none;color:inherit}.top{background:var(--ink);color:#fff;text-align:center;padding:9px;font-size:9px;letter-spacing:.2em}.top span{color:#e5c67d}.nav{position:sticky;top:0;z-index:10;background:#fffaf5ee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.navin{max-width:1250px;height:78px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:28px}.logo{font:800 31px 'Playfair Display',serif;margin-right:auto}.logo span{color:var(--rose)}.links{display:flex;gap:25px;font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.links a:hover{color:var(--rose)}.bag{background:var(--ink);color:#fff;border:0;border-radius:25px;padding:12px 18px;font-size:10px}.hero{background:linear-gradient(120deg,#24121b,#5b2944);color:#fff;padding:85px 24px}.heroIn{max-width:1250px;margin:auto}.kicker{color:#d9bd78;font-size:9px;letter-spacing:.25em;font-weight:800}.hero h1{font:800 clamp(55px,8vw,95px)/.9 'Playfair Display',serif;letter-spacing:-.06em;margin:18px 0}.hero p{color:#fff9;max-width:520px;line-height:1.9;font-size:13px}.wrap{max-width:1250px;margin:auto;padding:75px 24px}.tools{display:flex;gap:10px;margin-bottom:30px}.search{flex:1;padding:15px 20px;border:1px solid var(--line);border-radius:28px;background:#fff;outline:0}.select{border:1px solid var(--line);border-radius:28px;padding:0 16px;background:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.product{background:#fff;border:1px solid var(--line);border-radius:27px;overflow:hidden;transition:.25s}.product:hover{transform:translateY(-8px);box-shadow:0 30px 80px #24121b18}.pic{height:260px;display:grid;place-items:center;background:radial-gradient(circle,#fff,#fff0f5);font-size:88px;position:relative}.badge{position:absolute;top:13px;left:13px;background:var(--ink);color:#fff;border-radius:20px;padding:6px 9px;font-size:7px;letter-spacing:.12em}.body{padding:20px}.body h3{font:700 21px 'Playfair Display',serif;margin:0}.body p{font-size:10px;color:var(--muted);line-height:1.7;min-height:35px}.foot{display:flex;align-items:center;justify-content:space-between}.add{border:0;border-radius:23px;background:var(--rose);color:#fff;padding:11px 14px;font-size:9px;font-weight:800}footer{background:#10080d;color:#fff;text-align:center;padding:28px;font-size:9px}@media(max-width:800px){.links{display:none}.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.tools{flex-direction:column}.select{height:45px}}</style></head><body><div class="top">THE CANDYAURA COLLECTION <span>· PREMIUM SWEETS</span></div><div class="nav"><div class="navin"><div class="logo">Candy<span>aura</span></div><div class="links"><a href="index.html">Home</a><a href="shop.html">Collection</a><a href="checkout.html">Checkout</a></div><a class="bag" href="checkout.html">Bag →</a></div></div><section class="hero"><div class="heroIn"><div class="kicker">CURATED CONFECTIONS · 2026</div><h1>The collection.</h1><p>A refined edit of fruity favourites, chocolate indulgence, playful gummies and beautifully presented gifts.</p></div></section><main class="wrap"><div class="tools"><input id="q" class="search" placeholder="Search the collection…" oninput="render()"><select id="s" class="select" onchange="render()"><option value="f">Featured</option><option value="l">Price: Low to High</option><option value="h">Price: High to Low</option></select></div><div id="grid" class="grid"></div></main><footer>© 2026 CandyAura · The Art of Sweetness</footer><script>const p=[['Strawberry Velvet Gummies','Fruity',450,'🍓','BESTSELLER'],['Rose Berry Hearts','Fruity',480,'💗','NEW'],['Midnight Chocolate Bites','Chocolate',550,'🍫','SIGNATURE'],['Cocoa Pearl Box','Chocolate',850,'🤎','PREMIUM'],['Gummy Bears Atelier','Gummies',450,'🧸','POPULAR'],['Sour Luxe Mix','Gummies',500,'🍋','HOT'],['Rainbow Lollipops','Lollipops',400,'🍭','NEW'],['Strawberry Swirl Pops','Lollipops',450,'🍭','FAVOURITE'],['Petite Candy Jar','Gifts',650,'🎁','GIFT'],['Signature Candy Jar','Gifts',950,'🍬','SIGNATURE'],['Birthday Luxe Box','Gifts',1200,'🎂','GIFT'],['The Love Collection','Gifts',1450,'💕','PREMIUM'],['Royal Sweet Box','Gifts',1800,'👑','LUXURY']];function render(){let q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('s').value,a=p.filter(x=>(x[0]+x[1]).toLowerCase().includes(q));if(s==='l')a.sort((x,y)=>x[2]-y[2]);if(s==='h')a.sort((x,y)=>y[2]-x[2]);document.getElementById('grid').innerHTML=a.map(x=>`<article class="product"><div class="pic"><b class="badge">${x[4]}</b>${x[3]}</div><div class="body"><h3>${x[0]}</h3><p>Beautifully selected premium confectionery from CandyAura.</p><div class="foot"><b>Rs. ${x[2].toLocaleString()}</b><button class="add" onclick="add('${x[0]}',${x[2]})">Add to Bag</button></div></div></article>`).join('')}function add(n,pr){let c=JSON.parse(localStorage.getItem('candyAuraCart')||'[]');c.push({name:n,price:pr});localStorage.setItem('candyAuraCart',JSON.stringify(c));location.href='checkout.html'}render()</script></body></html>
