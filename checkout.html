<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CandyAura — Checkout</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#170b12;--rose:#d75b8d;--gold:#c7a25b;--cream:#fffaf5;--muted:#776a71;--line:#eadfe4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}.top{background:var(--ink);color:#fff;text-align:center;padding:9px;font-size:9px;letter-spacing:.2em}.top span{color:#e5c67d}.nav{background:#fff;border-bottom:1px solid var(--line)}.navin{max-width:1100px;height:78px;margin:auto;padding:0 22px;display:flex;align-items:center}.logo{font:800 31px 'Playfair Display',serif;margin-right:auto}.logo span{color:var(--rose)}.back{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.13em}.wrap{max-width:1100px;margin:auto;padding:70px 22px}.kicker{color:#9b486b;font-size:9px;letter-spacing:.25em;font-weight:800}.title{font:800 clamp(48px,7vw,76px)/.9 'Playfair Display',serif;margin:15px 0 45px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:28px}.box{background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px}.box h2{font:700 30px 'Playfair Display',serif;margin:0 0 20px}.field{width:100%;padding:14px;margin:6px 0 9px;border:1px solid var(--line);border-radius:12px;outline:0;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:11px}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:900;padding-top:20px}.place{width:100%;border:0;border-radius:28px;background:var(--rose);color:#fff;padding:15px;font-size:10px;font-weight:900;margin-top:20px}.secure{font-size:9px;color:var(--muted);line-height:1.7;margin-top:12px}.success{text-align:center;padding:35px 10px}.success h2{color:var(--rose)}.successNo{font:700 22px 'Playfair Display',serif;color:var(--gold)}footer{background:#10080d;color:#fff;text-align:center;padding:28px;font-size:9px}@media(max-width:750px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}</style></head><body><div class="top">SECURE CHECKOUT <span>· CANDYAURA</span></div><div class="nav"><div class="navin"><div class="logo">Candy<span>aura</span></div><a class="back" href="shop.html">← Back to collection</a></div></div><main class="wrap"><div class="kicker">YOUR SWEET MOMENT</div><h1 class="title">Complete your order.</h1><div id="app" class="grid"></div></main><footer>© 2026 CandyAura · The Art of Sweetness</footer><script>let cart=JSON.parse(localStorage.getItem('candyAuraCart')||'[]');function total(){return cart.reduce((s,x)=>s+x.price,0)}function render(){if(!cart.length){document.getElementById('app').innerHTML=`<div class="box"><h2>Your bag is empty.</h2><p>Choose something beautiful from our collection.</p><a class="place" style="display:block;text-align:center;text-decoration:none" href="shop.html">Explore Collection</a></div>`;return}document.getElementById('app').innerHTML=`<div class="box"><h2>Delivery details</h2><div class="row"><input id="name" class="field" placeholder="Full name"><input id="phone" class="field" placeholder="Phone number"></div><div class="row"><input id="city" class="field" placeholder="City"><input id="email" class="field" placeholder="Email (optional)"></div><input id="address" class="field" placeholder="Complete delivery address"><select id="payment" class="field"><option>Cash on Delivery</option><option>Bank Transfer</option></select><button class="place" onclick="place()">Place Order · Rs. ${total().toLocaleString()}</button><div class="secure">Your order is processed through the website checkout. No WhatsApp redirection.</div></div><div class="box"><h2>Your bag</h2>${cart.map((x,i)=>`<div class="item"><span>${x.name}</span><b>Rs. ${x.price.toLocaleString()}</b></div>`).join('')}<div class="total"><span>Total</span><span>Rs. ${total().toLocaleString()}</span></div></div>`}function place(){let n=name.value.trim(),p=phone.value.trim(),c=city.value.trim(),a=address.value.trim();if(!n||!p||!c||!a){alert('Please complete your delivery details.');return}let id='CA-'+Date.now().toString().slice(-7);localStorage.setItem('candyAuraOrder',JSON.stringify({id,n,p,c,a,payment:payment.value,items:cart,total:total()}));cart=[];localStorage.removeItem('candyAuraCart');document.getElementById('app').innerHTML=`<div class="box success"><div style="font-size:55px">✦</div><div class="kicker">ORDER CONFIRMED</div><h2>Your sweetness is on its way.</h2><div class="successNo">${id}</div><p>Thank you, ${n}. Your CandyAura order has been received successfully.</p><a class="place" style="display:block;text-align:center;text-decoration:none" href="index.html">Return to CandyAura</a></div>`}render()</script></body></html>
